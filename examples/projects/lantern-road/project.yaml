spec_version: "0.3"
id: lantern-road
name: "The Lantern Road"
workflow: novel
gates: milestones
seed: "An apprentice lamplighter walks the road between two quarrelling towns, and learns why its lamps keep going out."

parameters:
  pov: first-person
  tense: past
  viewpoints: chapter         # one viewpoint a chapter, with overrides in the outline (§7.7)
  told_from: end              # Ines tells the story from its end

setting:
  type: original
  temporal_model: linear

modules:
  travel: true
  mysteries: true

calendar:                       # the world's own calendar (§4.13)
  eras:
    - { id: BL, name: before the Lamps, counts: down }
    - { id: OR, name: the Old Road, years: 300 }
    - { id: NR, name: the New Road }
  months:
    - { name: Thaw, days: 90 }
    - { name: Bloom, days: 92 }
    - { name: Ember, days: 91 }
    - { name: Dark, days: 92 }
